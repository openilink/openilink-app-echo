services:
  echo-app:
    build: .
    container_name: openilink-app-echo
    restart: unless-stopped
    environment:
      PORT: "8081"
      HUB_URL: "https://hub.openilink.com"
      BASE_URL: "http://openilink-app-echo:8081"
      DATABASE_URL: "postgres://openilink:${PG_PASS}@openilink-postgres:5432/openilink?sslmode=disable"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.echo-app.rule=Host(`echo.app.openilink.com`)"
      - traefik.http.routers.echo-app.entrypoints=websecure
      - traefik.http.routers.echo-app.tls.certresolver=letsencrypt
      - traefik.http.services.echo-app.loadbalancer.server.port=8081
    networks:
      - traefik_default

networks:
  traefik_default:
    external: true
